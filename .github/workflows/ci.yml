name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      APP_NAME: Finance AI API
      APP_VERSION: 1.0.0
      ENVIRONMENT: test
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
      OPENAI_API_KEY: test-key
      OPENAI_MODEL: gpt-5.5
      OPENAI_MAX_OUTPUT_TOKENS: 220
      OPENAI_OCR_MODEL: gpt-4.1-mini
      OCR_MAX_FILE_SIZE_MB: 10

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis
        run: |
          python -m compileall -q app

      - name: Ejecutar pruebas unitarias
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Ejecutar análisis de seguridad estático con Bandit
        run: |
          pip install bandit
          bandit -r app -q

      - name: Verificar dependencias vulnerables
        run: |
          pip install pip-audit
          pip-audit
